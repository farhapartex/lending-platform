[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.28"
evm_version = "cancun"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

optimizer = true
optimizer_runs = 1000
bytecode_hash = "none"

gas_reports = ["*"]

[fuzz]
runs = 512
max_test_rejects = 200000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
shrink_run_limit = 5000

[lint]
exclude_lints = ["block-timestamp"]

[profile.default.fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
