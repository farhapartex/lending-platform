name: lending-platform

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: lending-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lending}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lending}
      POSTGRES_DB: ${POSTGRES_DB:-lending}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lending} -d ${POSTGRES_DB:-lending}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lending

  redis:
    image: redis:8.10-alpine
    container_name: lending-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lending

  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    container_name: lending-core-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: core-service
      HTTP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-lending}:${POSTGRES_PASSWORD:-lending}@postgres:5432/${POSTGRES_DB:-lending}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-core-service}
      CACHE_REQUEST_TIMEOUT: ${CACHE_REQUEST_TIMEOUT:-2s}
      ID_MASK_SECRET: ${ID_MASK_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CHAIN_ID: ${CHAIN_ID:-31337}
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://host.docker.internal:8545}
      CHAIN_CONFIRMATIONS: ${CHAIN_CONFIRMATIONS:-1}
      CHAIN_REQUEST_TIMEOUT: ${CHAIN_REQUEST_TIMEOUT:-15s}
      INDEXER_ENABLED: ${INDEXER_ENABLED:-true}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-2000}
      INDEXER_POLL_INTERVAL: ${INDEXER_POLL_INTERVAL:-5s}
      SNAPSHOT_INTERVAL: ${SNAPSHOT_INTERVAL:-60s}
      POOL_ADDRESS: ${POOL_ADDRESS:-0x0165878A594ca255338adfa4d48449f69242Eb8F}
      VAULT_ADDRESS: ${VAULT_ADDRESS:-0xa513E6E4b8f2a923D98304ec87F64353C4D5C853}
      CONTROLLER_ADDRESS: ${CONTROLLER_ADDRESS:-0x2279B7A0a67DB372996a5FaB50D91eAA73d2eBe6}
      LIQUIDATION_MANAGER_ADDRESS: ${LIQUIDATION_MANAGER_ADDRESS:-0x8A791620dd6260079BF849Dc5567aDC3F2FdC318}
      LENS_ADDRESS: ${LENS_ADDRESS:-0x610178dA211FEF7D417bC0e6FeD39F05609AD788}
      ORACLE_ADDRESS: ${ORACLE_ADDRESS:-0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9}
      RATE_MODEL_ADDRESS: ${RATE_MODEL_ADDRESS:-0x5FC8d32690cc91D4c39d9d3abcBD16989F875707}
      COLLATERAL_TOKEN_ADDRESS: ${COLLATERAL_TOKEN_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      DEBT_TOKEN_ADDRESS: ${DEBT_TOKEN_ADDRESS:-0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}
    ports:
      - "${CORE_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lending
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  redis-data:

networks:
  lending:
    driver: bridge
